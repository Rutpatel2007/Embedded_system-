[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.3
    adafruit/RTClib @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.0.4

[env:esp32dev_test]
extends = env:esp32dev
build_flags = -DTEST_MODE
